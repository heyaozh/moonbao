<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#030817" />
    <title>Moonbao 对照页</title>
    <style>
      :root {
        --bg: #050914;
        --panel: rgba(255, 255, 255, 0.06);
        --line: rgba(255, 255, 255, 0.14);
        --text: rgba(236, 240, 255, 0.88);
        --dim: rgba(222, 228, 250, 0.55);
        --gold: #ffd98f;
        --ui: -apple-system, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: radial-gradient(120% 80% at 50% 0%, #0d1530, var(--bg) 60%);
        color: var(--text);
        font: 14px/1.4 var(--ui);
      }
      header {
        position: sticky;
        top: 0;
        z-index: 2;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        padding: 12px 16px;
        background: rgba(5, 9, 20, 0.82);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--line);
      }
      header h1 {
        margin: 0 10px 0 0;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      header h1 b {
        color: var(--gold);
        font-weight: 600;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .chip,
      .btn {
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--text);
        border-radius: 999px;
        padding: 6px 12px;
        font: 500 13px/1 var(--ui);
        cursor: pointer;
      }
      .chip.on {
        border-color: rgba(255, 217, 143, 0.6);
        background: rgba(255, 217, 143, 0.18);
      }
      .chip .ref {
        color: var(--gold);
        margin-left: 4px;
      }
      .spacer {
        flex: 1;
      }
      label.opt {
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--dim);
        font-size: 13px;
      }
      main {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 28px;
        padding: 22px 16px 40px;
      }
      figure {
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }
      figcaption {
        color: var(--dim);
        font-size: 13px;
      }
      .frame {
        height: min(844px, calc(100vh - 150px));
        min-height: 480px;
        border-radius: 34px;
        overflow: hidden;
        border: 1px solid var(--line);
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55), inset 0 0 0 6px rgba(0, 0, 0, 0.6);
        background: #000;
      }
      .frame.phone {
        aspect-ratio: 390 / 844;
      }
      .frame.concept {
        aspect-ratio: 768 / 1152;
      }
      .frame iframe,
      .frame img {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        object-fit: cover;
      }
      .empty {
        display: grid;
        place-items: center;
        height: 100%;
        padding: 30px;
        color: var(--dim);
        text-align: center;
      }
      .hint {
        width: 100%;
        text-align: center;
        color: var(--dim);
        font-size: 12.5px;
      }
      kbd {
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 0 4px;
        font: 12px var(--ui);
      }
      @media (max-width: 700px) {
        .frame {
          height: auto;
          width: min(390px, calc(100vw - 32px));
          min-height: 0;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>moon<b>bao</b> · 对照页</h1>
      <div class="chips" id="chips"></div>
      <span class="spacer"></span>
      <label class="opt"><input type="checkbox" id="freeze" checked />定格到「好看的那一刻」</label>
      <button class="btn" id="reload">重放</button>
      <button class="btn" id="open">单独打开</button>
    </header>
    <main>
      <figure>
        <div class="frame phone"><iframe id="live" title="实时画面" allow="microphone; accelerometer; gyroscope"></iframe></div>
        <figcaption id="liveCap">实时</figcaption>
      </figure>
      <figure>
        <div class="frame concept" id="conceptFrame"></div>
        <figcaption id="conceptCap">概念图</figcaption>
      </figure>
      <p class="hint"><kbd>←</kbd> <kbd>→</kbd> 换场景 · 左边是真在跑的画面（演示大脑按剧本说话，可以直接点、拖、打字），右边是 assets/ui-concept 里的概念图</p>
    </main>
    <script type="module" src="./compare.ts"></script>
  </body>
</html>
