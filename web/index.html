<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#030817" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Moonbao</title>
    <link rel="stylesheet" href="./ui/glass.css" />
  </head>
  <body>
    <canvas id="moonCanvas"></canvas>

    <!-- 玻璃层：固定在屏幕这块「玻璃」上，不随倾斜移动 -->
    <div id="glass">
      <!-- 菜单：半透明的星星状齿轮（2026-09-30 用户：未来的菜单——登录、商城、我的月亮……） -->
      <button id="settingsBtn" class="glass-btn round stargear" aria-label="Menu">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12.00 1.80 L14.53 5.90 L19.21 4.79 L18.10 9.47 L22.20 12.00 L18.10 14.53 L19.21 19.21 L14.53 18.10 L12.00 22.20 L9.47 18.10 L4.79 19.21 L5.90 14.53 L1.80 12.00 L5.90 9.47 L4.79 4.79 L9.47 5.90 Z M14.90 12 a2.9 2.9 0 1 0 -5.80 0 a2.9 2.9 0 1 0 5.80 0 Z" fill="currentColor" fill-opacity="0.22" fill-rule="evenodd" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>
      </button>

      <div id="chatbar">
        <form id="chatForm" class="glass-pill" autocomplete="off">
          <input id="chatInput" type="text" enterkeyhint="send" placeholder="想和月亮说些什么…" />
        </form>
        <button id="voiceBtn" class="glass-btn round voice" aria-label="语音">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="9" y="3.2" width="6" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M5.8 11.2a6.2 6.2 0 0 0 12.4 0M12 17.4v3.2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <span>voice</span>
        </button>
      </div>

      <button id="gyroBtn" class="glass-pill hint" hidden>
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="7.5" y="3" width="9" height="18" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.4" transform="rotate(-14 12 12)"/><path d="M3.5 9.5a9 9 0 0 1 2.2-3.6M20.5 14.5a9 9 0 0 1-2.2 3.6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <span>Tilt your phone to look inside</span>
      </button>
    </div>

    <!-- 调试面板（?panel=off 收起；三击右上角角落也能开关） -->
    <aside id="panel" class="dev collapsed">
      <header>
        <b>moon<span>bao</span></b>
        <small id="panelSub">长跑 1 · 视觉</small>
        <button id="panelToggle">面板</button>
      </header>
      <div id="panelBody"></div>
      <footer id="fps"></footer>
    </aside>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
