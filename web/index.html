<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Moonbao</title>
  <style>
    :root {
      --ink: #e8e6f0; --muted: #9aa3bf; --line: rgba(255,255,255,.14); --accent: #ffd98a;
    }
    * { margin: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: #0c1530; color: var(--ink); overflow: hidden; touch-action: none;
      font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif;
    }
    /* 舞台：背景渐变由渲染层按钟点写；canvas 透明叠在上面 */
    #stage { position: fixed; inset: 0; background: linear-gradient(180deg, #050916, #0c1530 55%, #182448); }
    #moonCanvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    /* 边缘：极淡暗角 + 随倾斜滑动的玻璃反光。屏幕本身就是窗，不画框。 */
    #vignette { position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(120% 100% at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,.9) 100%); opacity: .28; }
    #glint { position: absolute; inset: -40%; pointer-events: none; opacity: .06; will-change: transform;
      background: radial-gradient(60% 45% at 30% 20%, rgba(255,255,255,.9) 0%, rgba(255,255,255,0) 70%); }

    /* ---- 对话壳 ---- */
    #status {
      position: fixed; top: 14px; left: 16px; z-index: 6;
      font-size: 12px; color: var(--muted); padding: 5px 10px; border-radius: 999px;
      background: rgba(255,255,255,.06); border: 1px solid var(--line);
      transition: color .3s, border-color .3s;
    }
    #status.think { color: var(--accent); }
    #status.speak { color: #b9d6ff; }
    #status.listen { color: #a8e0c4; }
    #status.off { color: #ff9a8a; }

    #bubble {
      position: fixed; left: 50%; top: 11%; transform: translateX(-50%); z-index: 6;
      max-width: min(420px, 78vw); padding: 12px 16px; border-radius: 18px 18px 18px 6px;
      background: rgba(255,255,255,.08); border: 1px solid var(--line); backdrop-filter: blur(10px);
      box-shadow: 0 6px 24px rgba(0,0,0,.25);
      font-size: 16px; line-height: 1.55; letter-spacing: .01em; white-space: pre-wrap;
      animation: pop .28s cubic-bezier(.2,.9,.3,1.2);
    }
    #bubble.streaming #bubbleText::after { content: "▍"; color: var(--accent); animation: blink 1s steps(2) infinite; }
    @keyframes pop { from { opacity: 0; transform: translateX(-50%) translateY(6px) scale(.96); } }
    @keyframes blink { 50% { opacity: 0; } }

    #userChip {
      position: fixed; right: 16px; bottom: 72px; z-index: 6; max-width: 46vw;
      font-size: 13px; color: #10182b; background: var(--accent); padding: 7px 12px; border-radius: 14px 14px 4px 14px;
      white-space: pre-wrap; opacity: .92;
    }

    #chatBar {
      position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 6;
      display: flex; gap: 8px; width: min(560px, 92vw);
      background: rgba(255,255,255,.08); backdrop-filter: blur(10px);
      border: 1px solid var(--line); border-radius: 999px; padding: 6px 6px 6px 16px;
    }
    #chatInput { flex: 1; border: 0; background: transparent; outline: 0; font: inherit; font-size: 15px; color: var(--ink); }
    #chatInput::placeholder { color: var(--muted); }
    #chatSend { border: 0; background: var(--accent); color: #10182b; border-radius: 999px; padding: 8px 16px; font-size: 13px; cursor: pointer; }
    body.nobrain #chatBar, body.nobrain #status { display: none; }

    /* ---- 调试面板 ---- */
    #panel {
      position: fixed; top: 14px; right: 14px; width: 250px; z-index: 5;
      background: rgba(10,16,32,.72); backdrop-filter: blur(10px);
      border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px 12px;
      font-size: 12.5px; max-height: calc(100vh - 28px); overflow: auto;
    }
    #panel.collapsed > :not(.head) { display: none; }
    #panel .head { display: flex; align-items: center; justify-content: space-between; }
    #panel h1 { font-size: 14px; }
    #panel h1 span { color: var(--accent); }
    #panelToggle { border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 12px; }
    #panel .sub { color: var(--muted); font-size: 11px; margin: 2px 0 8px; }
    #panel .grp { font-size: 11px; color: var(--muted); margin: 10px 0 5px; letter-spacing: .06em; }
    #actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; }
    #actions button, .btnrow button {
      border: 1px solid var(--line); background: rgba(255,255,255,.06); color: var(--ink);
      border-radius: 8px; padding: 6px 2px; font-size: 11.5px; cursor: pointer;
    }
    #actions button:hover, .btnrow button:hover { background: rgba(255,255,255,.14); }
    #actions button:active { transform: scale(0.96); }
    .btnrow button.on { background: rgba(255,217,138,.25); border-color: var(--accent); }
    .row { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
    .row label { width: 44px; flex: none; }
    .row input[type="range"] { flex: 1; accent-color: var(--accent); min-width: 0; }
    .row output { width: 34px; text-align: right; color: var(--muted); font-size: 11px; }
    .btnrow { display: flex; gap: 6px; margin-top: 6px; }
    .btnrow button { flex: 1; padding: 6px 0; }
    #latency, #fps { font-size: 11px; color: var(--muted); margin-top: 4px; }
    .log {
      font-size: 11px; line-height: 1.45; color: #c3c9dc; max-height: 120px; overflow: auto;
      background: rgba(0,0,0,.25); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px;
      white-space: pre-wrap; word-break: break-all;
    }
    #transcript .pet { color: var(--accent); }
    #transcript .me { color: #a8c8ff; }
    #hint { position: fixed; left: 16px; bottom: 12px; color: var(--muted); font-size: 11px; z-index: 5; }
    #gyro { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 7;
      padding: 12px 18px; border-radius: 999px; border: 1px solid var(--line); background: rgba(10,16,32,.8); color: var(--ink); font-size: 14px; }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="moonCanvas"></canvas>
    <div id="glint"></div>
    <div id="vignette"></div>
  </div>

  <button id="gyro" type="button" hidden>开启重力感应</button>
  <div id="status">……</div>
  <div id="bubble" hidden><div id="bubbleText"></div></div>
  <div id="userChip" hidden></div>
  <form id="chatBar">
    <input id="chatInput" type="text" placeholder="说点什么……" autocomplete="off" />
    <button id="chatSend" type="button">说</button>
  </form>

  <div id="panel">
    <div class="head">
      <h1>moon<span>bao</span> · P0</h1>
      <button id="panelToggle" type="button">收起</button>
    </div>
    <div class="sub" id="panelSub">会呼吸的月亮</div>
    <div id="fps">fps —</div>

    <div class="grp">动作原语（手动）</div>
    <div id="actions"></div>
    <div class="btnrow">
      <button id="closeup" type="button">特写（一只眼）</button>
      <button id="farAway" type="button">飞远</button>
    </div>

    <div class="grp">情绪目标（连续偏置，有惯性）</div>
    <div class="row"><label>心情</label><input id="valence" type="range" min="-1" max="1" step="0.01" value="0.2" /><output id="valenceOut">0.2</output></div>
    <div class="row"><label>活力</label><input id="arousal" type="range" min="0" max="1" step="0.01" value="0.5" /><output id="arousalOut">0.5</output></div>

    <div class="grp">月相与时间</div>
    <div class="row"><label>月相</label><input id="phase" type="range" min="0" max="360" step="1" value="40" /><output id="phaseOut">40</output></div>
    <div class="row"><label>钟点</label><input id="hour" type="range" min="-0.25" max="24" step="0.25" value="-0.25" /><output id="hourOut">实时</output></div>

    <div class="grp">眼睛（找到你的答案，我记下来当默认）</div>
    <div class="row"><label>高度</label><input id="eyeH" type="range" min="0.25" max="0.7" step="0.01" value="0.44" /><output id="eyeHOut">0.44</output></div>
    <div class="row"><label>间距</label><input id="eyeS" type="range" min="0.4" max="1.4" step="0.01" value="0.95" /><output id="eyeSOut">0.95</output></div>
    <div class="row"><label>大小</label><input id="eyeZ" type="range" min="0.08" max="0.32" step="0.005" value="0.19" /><output id="eyeZOut">0.19</output></div>

    <div class="grp">空间（鼠标位置 = 倾斜）</div>
    <div class="row"><label>深度</label><input id="depth" type="range" min="0" max="4" step="0.05" value="1.2" /><output id="depthOut">1.2</output></div>
    <div class="row"><label>幅度</label><input id="shift" type="range" min="0" max="1.2" step="0.02" value="0.5" /><output id="shiftOut">0.5</output></div>
    <div class="row"><label>重量</label><input id="sway" type="range" min="0" max="0.6" step="0.01" value="0.15" /><output id="swayOut">0.15</output></div>
    <div class="row"><label>阻尼ζ</label><input id="zeta" type="range" min="0.2" max="1.2" step="0.02" value="0.5" /><output id="zetaOut">0.5</output></div>
    <div class="btnrow">
      <button id="autoShake" type="button">自动摇</button>
      <button id="snap" type="button">截图</button>
      <button id="demoSeq" type="button">10 秒序列</button>
    </div>

    <div class="grp">对话</div>
    <div class="btnrow">
      <button id="proactive" type="button">主动开口(强制)</button>
      <button id="resetChat" type="button">重置对话</button>
    </div>
    <div id="latency">表情 — · 文字 — · 完成 —</div>

    <div class="grp">协议流（渲染层收到什么）</div>
    <div id="rlog" class="log"></div>

    <div class="grp">对话记录</div>
    <div id="transcript" class="log"></div>
  </div>

  <div id="hint">console: __act("bounce") · __step(2) · __snapSave() · ?brain=off 不连大脑</div>

  <script type="module" src="/main.ts"></script>
</body>
</html>
